<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EkClick Download Manager</title><link rel="stylesheet" href="styles.css"></head><body class="page manager-page"><header class="topbar page-topbar"><a class="brand" href="popup.html"><img src="assets/brand-mark.svg" alt=""><div><b>EkClick</b><small>Download Manager</small></div></a><div class="icon-actions"><button class="icon-button" id="themeToggle" aria-label="Cycle theme">◐</button><a class="icon-button settings-link" href="settings.html" aria-label="Settings">⚙</a></div></header><main class="page-content"><div class="page-heading manager-heading"><div><div class="eyebrow">YOUR DOWNLOADS</div><h1>Download Manager</h1><p>Track downloads handled by Brave or written into your selected folder.</p></div><div class="manager-actions"><button class="secondary-button" id="cancelPending">Cancel pending</button><button class="secondary-button" id="retryFailed">Retry failed</button><button class="secondary-button" id="clearAll">Clear all</button></div></div><section class="stats" id="stats"></section><section class="progress-card"><div class="progress-heading"><b>Batch progress</b><span id="progressLabel">0%</span></div><div class="progress-track"><span id="progressBar"></span></div><p id="progressText" class="muted">No EkClick downloads yet.</p></section><section class="manager-list-card"><div class="manager-list-head"><h2>Files</h2><div class="manager-filters"><input id="managerSearch" type="search" placeholder="Search filenames" aria-label="Search filenames"><select id="stateFilter" aria-label="Filter by status"><option value="all">All statuses</option><option value="queued">Queued</option><option value="downloading">Downloading</option><option value="complete">Completed</option><option value="failed">Failed</option><option value="skipped">Skipped</option></select></div></div><div class="manager-list" id="managerList"></div><div class="manager-footer"><span id="managerStatus" role="status"></span><button class="link-button" id="clearFinished">Clear completed and skipped</button></div></section></main><script src="shared/core.js"></script><script src="shared/directory-store.js"></script><script src="shared/download.js"></script><script src="shared/zip.js"></script><script src="shared/queue-result.js"></script><script src="shared/batch-queue.js"></script><script src="manager.js"></script></body></html>
